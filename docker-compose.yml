version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smarttech-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - smarttech
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: smarttech-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - smarttech
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: smarttech-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: smarttech
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: smarttech
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - smarttech

networks:
  smarttech:
    driver: bridge

volumes:
  dbdata:
    driver: local
