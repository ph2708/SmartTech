<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="storeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fundo Circular Moderno com Gradiente -->
  <rect width="512" height="512" rx="128" fill="url(#storeGrad)"/>

  <!-- Toldo / Fachada de Loja Moderna & Sacola -->
  <g filter="url(#shadow)">
    <!-- Corpo da Sacola de Compras / Loja -->
    <path d="M140 190 C140 170, 155 155, 175 155 L337 155 C357 155, 372 170, 372 190 L392 390 C394 412, 378 430, 356 430 L156 430 C134 430, 118 412, 120 390 Z" fill="url(#bagGrad)"/>

    <!-- Alça da Sacola Elegante -->
    <path d="M196 170 L196 125 C196 90, 222 62, 256 62 C290 62, 316 90, 316 125 L316 170" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>

    <!-- Detalhes do Toldo Superior da Loja -->
    <path d="M130 190 L382 190 L370 235 C370 245, 360 255, 348 255 C336 255, 326 245, 326 235 L326 190 L286 190 L286 235 C286 245, 276 255, 264 255 C252 255, 242 245, 242 235 L242 190 L202 190 L202 235 C202 245, 192 255, 180 255 C168 255, 158 245, 158 235 L146 190 Z" fill="#e63946"/>

    <!-- Raio / Ícone de Vendas Rápidas e Tecnologia (Smart) no Centro -->
    <path d="M268 250 L220 330 L254 330 L244 400 L292 320 L258 320 Z" fill="#e63946"/>
  </g>
</svg>
